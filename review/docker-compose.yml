# open-credits review: hand-check of sampled OCR lines, behind www.vaugouin.com/oc-review/ (basic auth at the proxy).
# Host network, as every stack that reaches MariaDB (published on 127.0.0.1:3306 only); listens on the Docker
# bridge address, which the reverseproxy container reaches.
services:
  oc-review:
    build: .
    image: oc-review:local
    container_name: oc-review
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      REVIEW_HOST: 172.17.0.1
      REVIEW_PORT: "8196"
      REVIEW_SHARED: /shared
    volumes:
      - /home/debian/docker/shared_data/oc-review:/shared:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
