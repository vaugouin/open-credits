[project]
name = "opencredits"
version = "0.8.2"
description = "open-credits client prototype: read the credits of video files with OCR, from a queue fed by Plex, store them in SQLite, send submission bundles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "opencc>=1.4.2",
    "pillow>=11",
]

[project.optional-dependencies]
# PaddlePaddle 3.3 fails on CPU with oneDNN (NotImplementedError in ConvertPirAttribute2RuntimeAttribute);
# 3.2 keeps oneDNN and is five times faster than 3.3 with oneDNN switched off.
paddle = ["paddleocr>=3.3,<4", "paddlepaddle==3.2.2"]
tesseract = ["pytesseract>=0.3.13"]

[project.scripts]
opencredits = "opencredits.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencredits"]

# the client's SQLite schema lives in the repository's doc/sql; a built wheel carries a copy (store.ddl reads either)
[tool.hatch.build.targets.wheel.force-include]
"../doc/sql/client-sqlite.sql" = "opencredits/client-sqlite.sql"
